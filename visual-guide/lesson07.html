<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>第7回｜図解ガイド</title><link rel="stylesheet" href="../assets/lesson.css"></head><body class="lesson-visual-reading"><main class="visual-index"><header><p class="visual-eyebrow">生成AIアプリ開発ゼミ · VISUAL GUIDE</p><h1>第7回を、図で理解する。</h1><p>不具合の伝え方から、切り分け、仕上げ、卒業制作まで。小さな画面では、読みやすい文字のまま縦に並べます。</p><nav aria-label="教材を開く"><a href="../lessons/lesson07/">第7回の教材を開く ↗</a></nav></header><article><figure class="fig lv-diagram" data-diagram="l07_report"><a class="zoom lv-image" href="../assets/figs/lesson07/l07_report.webp"><img src="../assets/figs/lesson07/l07_report.webp" alt="不具合は、3点そろえて渡す。症状：何が起きたか。エラーの文は省略しない。。例：保存を押しても一覧が3件のまま。再現手順：画面・入力値・押す順番・元の件数。。例：3件ある一覧で500円を入力し、保存。期待する結果：本来どうなるはずか。。例：一覧が4件になり、500円の行が増える。渡す前に、APIキー・個人情報・業務の実データを除く。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">不具合は、3点そろえて渡す</p><div class="lv-stack"><div class="lv-card"><strong>症状</strong><p>何が起きたか。エラーの文は省略しない。<br>例：保存を押しても一覧が3件のまま</p></div><div class="lv-card"><strong>再現手順</strong><p>画面・入力値・押す順番・元の件数。<br>例：3件ある一覧で500円を入力し、保存</p></div><div class="lv-card"><strong>期待する結果</strong><p>本来どうなるはずか。<br>例：一覧が4件になり、500円の行が増える</p></div></div><p class="lv-note">渡す前に、APIキー・個人情報・業務の実データを除く。</p><a class="lv-original" href="../assets/figs/lesson07/l07_report.webp">図解を画像で開く ↗</a></div><figcaption>不具合は、3点そろえて渡す（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l07_layers"><a class="zoom lv-image" href="../assets/figs/lesson07/l07_layers.webp"><img src="../assets/figs/lesson07/l07_layers.webp" alt="4つの場所を見て、原因を絞る。画面側 → コンソール：押した操作への反応と、エラーの文を見る。。通信 → ネットワーク：要求・返答・ステータス・送信回数を見る。。サーバー側 → ターミナル：保存やAI呼び出しで出た内容を見る。。保存 → 保存先の中身：記録が無い・二重にある・正しく入っているかを見る。。localStorageの保存は1→4。AI機能は1→2→3。表示と保存先の両方を確かめる。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">4つの場所を見て、原因を絞る</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>画面側 → コンソール</strong><p>押した操作への反応と、エラーの文を見る。</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>通信 → ネットワーク</strong><p>要求・返答・ステータス・送信回数を見る。</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>サーバー側 → ターミナル</strong><p>保存やAI呼び出しで出た内容を見る。</p></div></li><li><span class="lv-step" aria-hidden="true">4</span><div><strong>保存 → 保存先の中身</strong><p>記録が無い・二重にある・正しく入っているかを見る。</p></div></li></ol><p class="lv-note">localStorageの保存は1→4。AI機能は1→2→3。表示と保存先の両方を確かめる。</p><a class="lv-original" href="../assets/figs/lesson07/l07_layers.webp">図解を画像で開く ↗</a></div><figcaption>4つの場所を見て、原因を絞る（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l07_states"><a class="zoom lv-image" href="../assets/figs/lesson07/l07_states.webp"><img src="../assets/figs/lesson07/l07_states.webp" alt="つないだあとも、3つの状態を確認。1件も無いとき：読み込み成功・0件のときに、次の操作を案内。。読み込み失敗を「0件」にしない。。処理中：待機表示と、押せないボタン。。保存・読み込み・AIでも、送信回数を確認。。失敗したとき：利用者向けの短い案内を出し、入力を残す。。詳しい原因は画面に出さず、ターミナルで調べる。。試す → 元に戻す → よく使う操作を1回確認。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">つないだあとも、3つの状態を確認</p><div class="lv-stack"><div class="lv-card"><strong>1件も無いとき</strong><p>読み込み成功・0件のときに、次の操作を案内。<br>読み込み失敗を「0件」にしない。</p></div><div class="lv-card"><strong>処理中</strong><p>待機表示と、押せないボタン。<br>保存・読み込み・AIでも、送信回数を確認。</p></div><div class="lv-card"><strong>失敗したとき</strong><p>利用者向けの短い案内を出し、入力を残す。<br>詳しい原因は画面に出さず、ターミナルで調べる。</p></div></div><p class="lv-note">試す → 元に戻す → よく使う操作を1回確認。</p><a class="lv-original" href="../assets/figs/lesson07/l07_states.webp">図解を画像で開く ↗</a></div><figcaption>つないだあとも、3つの状態を確認（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l07_graduation"><a class="zoom lv-image" href="../assets/figs/lesson07/l07_graduation.webp"><img src="../assets/figs/lesson07/l07_graduation.webp" alt="卒業制作は、4項目を対応させる。決めた機能：仕様書と今のアプリから、今回仕上げる範囲を選ぶ。。完成条件：機能ごとに「何を入れ、何を押し、何が見えるか」を書く。。試した結果：完成条件ごとにOK／NG、テストの結果、画面の証拠を残す。。まだ直っていない点：NGと分かっている不具合を全部書く。症状・切り分けた範囲・次の作業を残す。。docs/graduation.md に記録する。機能数より、条件・結果・残った課題の対応を見る。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">卒業制作は、4項目を対応させる</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>決めた機能</strong><p>仕様書と今のアプリから、今回仕上げる範囲を選ぶ。</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>完成条件</strong><p>機能ごとに「何を入れ、何を押し、何が見えるか」を書く。</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>試した結果</strong><p>完成条件ごとにOK／NG、テストの結果、画面の証拠を残す。</p></div></li></ol><div class="lv-arrow">↓ 結果に応じて分ける</div><div class="lv-branches"><div class="lv-card lv-teal"><strong>OK：その条件の確認は完了</strong><p>確認した結果と証拠を残します。</p></div><div class="lv-card"><p class="lv-error">NG・分かっている不具合はすべて記録</p><strong>まだ直っていない点</strong><p>NGと分かっている不具合を全部書く。症状・切り分けた範囲・次の作業を残す。</p></div></div><p class="lv-note">docs/graduation.md に記録する。機能数より、条件・結果・残った課題の対応を見る。</p><a class="lv-original" href="../assets/figs/lesson07/l07_graduation.webp">図解を画像で開く ↗</a></div><figcaption>卒業制作は、4項目を対応させる（仕組みを示す模式図）</figcaption></figure></article></main></body></html>
