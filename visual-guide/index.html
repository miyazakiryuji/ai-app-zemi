<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>第1〜5回｜図解ガイド</title><link rel="stylesheet" href="../assets/lesson.css"></head><body class="lesson-visual-reading"><main class="visual-index"><header><p class="visual-eyebrow">生成AIアプリ開発ゼミ · VISUAL GUIDE</p><h1>第1〜5回を、図で理解する。</h1><p>仕組み・判断・手順をまとめた15点の図解。小さな画面では、読みやすい文字のまま縦に並べます。</p><nav aria-label="回を選ぶ"><a href="#lesson01">第1回</a> <a href="#lesson02">第2回</a> <a href="#lesson03">第3回</a> <a href="#lesson04">第4回</a> <a href="#lesson05">第5回</a> </nav></header><section id="lesson01"><h2>第1回 · オリエンテーション</h2><p><a href="../index.html">教材を開く ↗</a></p><article><figure class="fig lv-diagram" data-diagram="l01_cycle"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l01_cycle.webp"><img src="../assets/figs/lessons01-05/l01_cycle.webp" alt="自習・実践・振り返りを繰り返す。LIVEの前：指定Lessonを視聴・実践し、事前課題を提出。LIVEで共有：課題の講評とQ&amp;Aで、つまずきを確認。自分のアプリで実践：補足解説をもとに、自分のアプリを進める。次回までに：次の自習と課題に取り組む。第1回までの事前課題はありません。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">自習・実践・振り返りを繰り返す</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>LIVEの前</strong><p>指定Lessonを視聴・実践し、事前課題を提出</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>LIVEで共有</strong><p>課題の講評とQ&amp;Aで、つまずきを確認</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>自分のアプリで実践</strong><p>補足解説をもとに、自分のアプリを進める</p></div></li><li><span class="lv-step" aria-hidden="true">4</span><div><strong>次回までに</strong><p>次の自習と課題に取り組む</p></div></li></ol><p class="lv-note">第1回までの事前課題はありません。</p><a class="lv-original" href="../assets/figs/lessons01-05/l01_cycle.webp">図解を画像で開く ↗</a></div><figcaption>自習・実践・振り返りを繰り返す（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l01_help"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l01_help.webp"><img src="../assets/figs/lessons01-05/l01_help.webp" alt="困ったときは、この順に聞く。1 スクショを撮ってAIへ：やりたいこと・期待した結果・実際の結果を添える。2 ゼミ掲示板へ：試したこと・詰まった箇所・環境も伝える。3 課題提出フォームへ：質問欄に記入。共通の内容はLIVEで回答。解決しないときに次へ。個別返信は約束されません。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">困ったときは、この順に聞く</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>1 スクショを撮ってAIへ</strong><p>やりたいこと・期待した結果・実際の結果を添える</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>2 ゼミ掲示板へ</strong><p>試したこと・詰まった箇所・環境も伝える</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>3 課題提出フォームへ</strong><p>質問欄に記入。共通の内容はLIVEで回答</p></div></li></ol><p class="lv-note">解決しないときに次へ。個別返信は約束されません。</p><a class="lv-original" href="../assets/figs/lessons01-05/l01_help.webp">図解を画像で開く ↗</a></div><figcaption>困ったときは、この順に聞く（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l01_roles"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l01_roles.webp"><img src="../assets/figs/lessons01-05/l01_roles.webp" alt="人が決めて、AIが作り、人が確かめる。人：決める：目的・作る範囲・完成の条件。AI：作る・直す：コード作成、原因の推測、修正。人：確かめる：実物を操作し、期待した結果と比べる。人：次の指示：違いを具体的に伝えて修正を頼む。「作りました」という返答だけで、完成にしない。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">人が決めて、AIが作り、人が確かめる</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>人：決める</strong><p>目的・作る範囲・完成の条件</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>AI：作る・直す</strong><p>コード作成、原因の推測、修正</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>人：確かめる</strong><p>実物を操作し、期待した結果と比べる</p></div></li><li><span class="lv-step" aria-hidden="true">4</span><div><strong>人：次の指示</strong><p>違いを具体的に伝えて修正を頼む</p></div></li></ol><p class="lv-note">「作りました」という返答だけで、完成にしない。</p><a class="lv-original" href="../assets/figs/lessons01-05/l01_roles.webp">図解を画像で開く ↗</a></div><figcaption>人が決めて、AIが作り、人が確かめる（仕組みを示す模式図）</figcaption></figure></article></section><section id="lesson02"><h2>第2回 · 要件定義</h2><p><a href="../lessons/lesson02/">教材を開く ↗</a></p><article><figure class="fig lv-diagram" data-diagram="l02_mvp"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l02_mvp.webp"><img src="../assets/figs/lessons01-05/l02_mvp.webp" alt="MVPは「1回使える最小の範囲」。残す① 目的に必要：食費を入力 → 一覧を見る → 合計を確認。残す② 間違い・消失・危険を防ぐ：入力のチェック、必要な修正・削除など。今回は作らない：無くても1回使える機能。例：CSV出力。①にも②にも当てはまらない機能は、あとまわし。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">MVPは「1回使える最小の範囲」</p><div class="lv-stack"><div class="lv-card"><strong>残す① 目的に必要</strong><p>食費を入力 → 一覧を見る → 合計を確認</p></div><div class="lv-card"><strong>残す② 間違い・消失・危険を防ぐ</strong><p>入力のチェック、必要な修正・削除など</p></div><div class="lv-card"><strong>今回は作らない</strong><p>無くても1回使える機能。例：CSV出力</p></div></div><p class="lv-note">①にも②にも当てはまらない機能は、あとまわし。</p><a class="lv-original" href="../assets/figs/lessons01-05/l02_mvp.webp">図解を画像で開く ↗</a></div><figcaption>MVPは「1回使える最小の範囲」（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l02_types"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l02_types.webp"><img src="../assets/figs/lessons01-05/l02_types.webp" alt="主な使い方で、型を1つ選ぶ。記録型：入力 → ためる → 見返す。例：食費メモ・読書記録。変換型：入力 → 別の形に変える → 結果。例：要約・文章の言い換え。相談型：質問 → 回答 → やり取りを残す。例：自分の資料に基づく相談。複数の特徴があっても、主な型を1つ決める。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">主な使い方で、型を1つ選ぶ</p><div class="lv-stack"><div class="lv-card"><strong>記録型</strong><p>入力 → ためる → 見返す<br>例：食費メモ・読書記録</p></div><div class="lv-card"><strong>変換型</strong><p>入力 → 別の形に変える → 結果<br>例：要約・文章の言い換え</p></div><div class="lv-card"><strong>相談型</strong><p>質問 → 回答 → やり取りを残す<br>例：自分の資料に基づく相談</p></div></div><p class="lv-note">複数の特徴があっても、主な型を1つ決める。</p><a class="lv-original" href="../assets/figs/lessons01-05/l02_types.webp">図解を画像で開く ↗</a></div><figcaption>主な使い方で、型を1つ選ぶ（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l02_documents"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l02_documents.webp"><img src="../assets/figs/lessons01-05/l02_documents.webp" alt="仕様書を、確かめられる作業に分ける。docs/spec.md：何を作るか：目的／やること／やらないこと／データ／画面／使う技術。docs/tasks.md：どの順で作るか：1回の指示で作れる単位に分ける。作業ごとに完了条件：例：500円を入力して保存すると、一覧に1件増える。小さく分ければ、できた範囲と不具合の範囲を追える。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">仕様書を、確かめられる作業に分ける</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>docs/spec.md：何を作るか</strong><p>目的／やること／やらないこと／データ／画面／使う技術</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>docs/tasks.md：どの順で作るか</strong><p>1回の指示で作れる単位に分ける</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>作業ごとに完了条件</strong><p>例：500円を入力して保存すると、一覧に1件増える</p></div></li></ol><p class="lv-note">小さく分ければ、できた範囲と不具合の範囲を追える。</p><a class="lv-original" href="../assets/figs/lessons01-05/l02_documents.webp">図解を画像で開く ↗</a></div><figcaption>仕様書を、確かめられる作業に分ける（仕組みを示す模式図）</figcaption></figure></article></section><section id="lesson03"><h2>第3回 · モックを作る</h2><p><a href="../lessons/lesson03/">教材を開く ↗</a></p><article><figure class="fig lv-diagram" data-diagram="l03_layers"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l03_layers.webp"><img src="../assets/figs/lessons01-05/l03_layers.webp" alt="見た目 → 動き → 裏側の順に作る。第3回：見た目：HTML・CSSで、配置と読みやすさを確認。第4回：動き：JavaScriptで、押した結果を確認。第5回：裏側：必要な保存やAIの呼び出しを追加。1段ずつ確かめると、不具合の原因を探す範囲が狭くなる。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">見た目 → 動き → 裏側の順に作る</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>第3回：見た目</strong><p>HTML・CSSで、配置と読みやすさを確認</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>第4回：動き</strong><p>JavaScriptで、押した結果を確認</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>第5回：裏側</strong><p>必要な保存やAIの呼び出しを追加</p></div></li></ol><p class="lv-note">1段ずつ確かめると、不具合の原因を探す範囲が狭くなる。</p><a class="lv-original" href="../assets/figs/lessons01-05/l03_layers.webp">図解を画像で開く ↗</a></div><figcaption>見た目 → 動き → 裏側の順に作る（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l03_polish"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l03_polish.webp"><img src="../assets/figs/lessons01-05/l03_polish.webp" alt="見た目は、この順番で整える。1 崩れを直す：はみ出し・重なり・ボタンの見切れを解消。2 テイストを決める：色・文字・余白・角の丸みを揃える。3 細部を1点ずつ：ボタンの位置、列幅などを調整。先に細部を直すと、全体の変更でやり直しになる。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">見た目は、この順番で整える</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>1 崩れを直す</strong><p>はみ出し・重なり・ボタンの見切れを解消</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>2 テイストを決める</strong><p>色・文字・余白・角の丸みを揃える</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>3 細部を1点ずつ</strong><p>ボタンの位置、列幅などを調整</p></div></li></ol><p class="lv-note">崩れを直したら、テイスト変更前のスクリーンショットを保存。</p><p class="lv-note">先に細部を直すと、全体の変更でやり直しになる。</p><a class="lv-original" href="../assets/figs/lessons01-05/l03_polish.webp">図解を画像で開く ↗</a></div><figcaption>見た目は、この順番で整える（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l03_alignment"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l03_alignment.webp"><img src="../assets/figs/lessons01-05/l03_alignment.webp" alt="仕様書と画面の違いは、人が判断する。違いを一覧にする：docs/spec.md と画面を比較。まだ変更しない。採用しない変更：画面を、決めた仕様に戻す。採用する変更：人が決めた内容だけ仕様書へ反映。仕様書と画面を揃えてから、次の動きを足す。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">仕様書と画面の違いは、人が判断する</p><div class="lv-card"><strong>違いを一覧にする</strong><p>docs/spec.md と画面を比較。まだ変更しない</p></div><div class="lv-arrow">↓ 人が採用を判断</div><div class="lv-branches"><div class="lv-card"><strong>採用しない変更</strong><p>画面を、決めた仕様に戻す</p></div><div class="lv-card"><strong>採用する変更</strong><p>人が決めた内容だけ仕様書へ反映</p></div></div><p class="lv-note">仕様書と画面を揃えてから、次の動きを足す。</p><a class="lv-original" href="../assets/figs/lessons01-05/l03_alignment.webp">図解を画像で開く ↗</a></div><figcaption>仕様書と画面の違いは、人が判断する（仕組みを示す模式図）</figcaption></figure></article></section><section id="lesson04"><h2>第4回 · 画面側を作る</h2><p><a href="../lessons/lesson04/">教材を開く ↗</a></p><article><figure class="fig lv-diagram" data-diagram="l04_scope"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l04_scope.webp"><img src="../assets/figs/lessons01-05/l04_scope.webp" alt="第4回は、ブラウザの中で動かす。操作：500円を入れて「保存」を押す。JavaScriptが処理：入力を確認し、画面内のデータを更新。画面を更新：一覧に1行追加。合計が500円増える。再読み込み：見本データだけの最初の状態に戻る。この回は保存先・サーバー・本物のAIをまだ作らない。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">第4回は、ブラウザの中で動かす</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>操作</strong><p>500円を入れて「保存」を押す</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>JavaScriptが処理</strong><p>入力を確認し、画面内のデータを更新</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>画面を更新</strong><p>一覧に1行追加。合計が500円増える</p></div></li><li><span class="lv-step" aria-hidden="true">4</span><div><strong>再読み込み</strong><p>見本データだけの最初の状態に戻る</p></div></li></ol><p class="lv-note">この回は保存先・サーバー・本物のAIをまだ作らない。</p><a class="lv-original" href="../assets/figs/lessons01-05/l04_scope.webp">図解を画像で開く ↗</a></div><figcaption>第4回は、ブラウザの中で動かす（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l04_states"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l04_states.webp"><img src="../assets/figs/lessons01-05/l04_states.webp" alt="成功したとき以外も、画面に伝える。入力が不正：欄の近くに理由を表示。入力は残す。1件も無い：次にする操作を案内する。処理中：処理中と表示し、ボタンの連打を防ぐ。失敗：失敗を表示し、入力を残して再試行できる。処理中・失敗は、仮の応答でも確かめられる。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">成功したとき以外も、画面に伝える</p><div class="lv-stack"><div class="lv-card"><strong>入力が不正</strong><p>欄の近くに理由を表示。入力は残す</p></div><div class="lv-card"><strong>1件も無い</strong><p>次にする操作を案内する</p></div><div class="lv-card"><strong>処理中</strong><p>処理中と表示し、ボタンの連打を防ぐ</p></div><div class="lv-card"><strong>失敗</strong><p>失敗を表示し、入力を残して再試行できる</p></div></div><p class="lv-note">処理中・失敗は、仮の応答でも確かめられる。</p><a class="lv-original" href="../assets/figs/lessons01-05/l04_states.webp">図解を画像で開く ↗</a></div><figcaption>成功したとき以外も、画面に伝える（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l04_loop"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l04_loop.webp"><img src="../assets/figs/lessons01-05/l04_loop.webp" alt="1行作ったら、前の動きも確かめる。選ぶ：actions.md の「まだ」の先頭1行。作る：変更するファイルと中身を確認して許可。試す：「確かめ方」を自分の手で操作。結果を残す：OK／NGと実際の結果を記録。前の動きも押す：壊れていなければ、次の1行へ。「作った」と「確かめた結果」は別々に記録する。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">1行作ったら、前の動きも確かめる</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>選ぶ</strong><p>actions.md の「まだ」の先頭1行</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>作る</strong><p>変更するファイルと中身を確認して許可</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>試す</strong><p>「確かめ方」を自分の手で操作</p></div></li><li><span class="lv-step" aria-hidden="true">4</span><div><strong>結果を残す</strong><p>OK／NGと実際の結果を記録</p></div></li><li><span class="lv-step" aria-hidden="true">5</span><div><strong>前の動きも押す</strong><p>壊れていなければ、次の1行へ</p></div></li></ol><p class="lv-note">「作った」と「確かめた結果」は別々に記録する。</p><a class="lv-original" href="../assets/figs/lessons01-05/l04_loop.webp">図解を画像で開く ↗</a></div><figcaption>1行作ったら、前の動きも確かめる（仕組みを示す模式図）</figcaption></figure></article></section><section id="lesson05"><h2>第5回 · API連携とデータの持ち方</h2><p><a href="../lessons/lesson05/">教材を開く ↗</a></p><article><figure class="fig lv-diagram" data-diagram="l05_route"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l05_route.webp"><img src="../assets/figs/lessons01-05/l05_route.webp" alt="APIキーは、サーバー側で使う。画面：ブラウザ：入力を自分のサーバーへ送る。キーは持たない。自分のサーバー：APIキーを付けて、AIサービスへ要求。AIサービス：生成した結果を、サーバーへ返す。画面に表示：サーバーから受け取った結果を表示。キーを画面のコード・共有リポジトリ・提出画像に入れない。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">APIキーは、サーバー側で使う</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>画面：ブラウザ</strong><p>入力を自分のサーバーへ送る。キーは持たない</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>自分のサーバー</strong><p>APIキーを付けて、AIサービスへ要求</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>AIサービス</strong><p>生成した結果を、サーバーへ返す</p></div></li><li><span class="lv-step" aria-hidden="true">4</span><div><strong>画面に表示</strong><p>サーバーから受け取った結果を表示</p></div></li></ol><p class="lv-note">キーを画面のコード・共有リポジトリ・提出画像に入れない。</p><a class="lv-original" href="../assets/figs/lessons01-05/l05_route.webp">図解を画像で開く ↗</a></div><figcaption>APIキーは、サーバー側で使う（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l05_switch"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l05_switch.webp"><img src="../assets/figs/lessons01-05/l05_switch.webp" alt="固定の文章で通してから、AIへ。先に：経路を確認：画面 → サーバー →「テスト応答です」→ 画面。次に：中身を差し替え：画面 → サーバー → AI → サーバー → 画面。確認する：要求は1回か、処理中・失敗の表示も出るか。一度に作らず、通信の問題とAI側の問題を分けて調べる。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">固定の文章で通してから、AIへ</p><ol class="lv-flow"><li><span class="lv-step" aria-hidden="true">1</span><div><strong>先に：経路を確認</strong><p>画面 → サーバー →「テスト応答です」→ 画面</p></div></li><li><span class="lv-step" aria-hidden="true">2</span><div><strong>次に：中身を差し替え</strong><p>画面 → サーバー → AI → サーバー → 画面</p></div></li><li><span class="lv-step" aria-hidden="true">3</span><div><strong>確認する</strong><p>要求は1回か、処理中・失敗の表示も出るか</p></div></li></ol><p class="lv-note">一度に作らず、通信の問題とAI側の問題を分けて調べる。</p><a class="lv-original" href="../assets/figs/lessons01-05/l05_switch.webp">図解を画像で開く ↗</a></div><figcaption>固定の文章で通してから、AIへ（仕組みを示す模式図）</figcaption></figure></article><article><figure class="fig lv-diagram" data-diagram="l05_storage"><a class="zoom lv-image" href="../assets/figs/lessons01-05/l05_storage.webp"><img src="../assets/figs/lessons01-05/l05_storage.webp" alt="保存先は「どこで使うか」で選ぶ。試作・表示設定：localStorage：ブラウザ内。サイトデータ削除で消える。別ブラウザでは別のデータ。自分のPCだけ：JSON／SQLite：PCのファイル。削除・PC故障に備えてバックアップ。複数の端末から：Turso：インターネット上のDB。削除・契約停止などに注意。表を人が見て直す：Google スプレッドシート。共有権限・列の変更に注意。選んだ保存先を docs/spec.md に記録する。" width="1536" height="1024" loading="lazy"></a><div class="lv-mobile"><p class="lv-title">保存先は「どこで使うか」で選ぶ</p><div class="lv-stack"><div class="lv-card"><strong>試作・表示設定</strong><p>localStorage：ブラウザ内<br>サイトデータ削除で消える。別ブラウザでは別のデータ</p></div><div class="lv-card"><strong>自分のPCだけ</strong><p>JSON／SQLite：PCのファイル<br>削除・PC故障に備えてバックアップ</p></div><div class="lv-card"><strong>複数の端末から</strong><p>Turso：インターネット上のDB<br>削除・契約停止などに注意</p></div><div class="lv-card"><strong>表を人が見て直す</strong><p>Google スプレッドシート<br>共有権限・列の変更に注意</p></div></div><p class="lv-note">選んだ保存先を docs/spec.md に記録する。</p><a class="lv-original" href="../assets/figs/lessons01-05/l05_storage.webp">図解を画像で開く ↗</a></div><figcaption>保存先は「どこで使うか」で選ぶ（仕組みを示す模式図）</figcaption></figure></article></section></main></body></html>
