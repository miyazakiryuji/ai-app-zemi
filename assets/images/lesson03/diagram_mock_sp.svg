<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 860" role="img" aria-labelledby="title desc">
  <title id="title">モックと完成したアプリの違い</title>
  <desc id="desc">モックには画面だけがあり、完成したアプリには画面、動き、保存があることを上下で比較した図。モックで作った画面は完成したアプリにそのまま使う（スマートフォン向けの縦長版）。</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5A6178"/>
    </marker>
  </defs>
  <rect width="360" height="860" fill="#FFF9F0"/>

  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text x="16" y="40" font-size="22" font-weight="700">モックと完成したアプリの違い</text>

    <!-- モック -->
    <rect x="16" y="64" width="328" height="272" rx="18" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="3"/>
    <rect x="32" y="80" width="296" height="54" rx="14" fill="#4DA8FF" fill-opacity="0.14"/>
    <text x="180" y="114" font-size="20" font-weight="700" text-anchor="middle">モック（この回で作るもの）</text>
    <rect x="40" y="150" width="280" height="56" rx="14" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2"/>
    <text x="180" y="184" font-size="18" font-weight="700" text-anchor="middle">画面（HTML・CSS）</text>
    <circle cx="44" cy="234" r="5" fill="#4DA8FF"/>
    <text x="60" y="240" font-size="18">見た目と配置だけ</text>
    <circle cx="44" cy="270" r="5" fill="#4DA8FF"/>
    <text x="60" y="276" font-size="18">押しても何も起きない</text>
    <circle cx="44" cy="306" r="5" fill="#4DA8FF"/>
    <text x="60" y="312" font-size="18">保存も計算もしない</text>

    <!-- そのまま使う -->
    <path d="M180 344V382" fill="none" stroke="#5A6178" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
    <text x="196" y="370" font-size="18" font-weight="700" fill="#5A6178">そのまま使う</text>

    <!-- 完成したアプリ -->
    <rect x="16" y="392" width="328" height="340" rx="18" fill="#FFFFFF" stroke="#FF8C42" stroke-width="3"/>
    <rect x="32" y="408" width="296" height="54" rx="14" fill="#FF8C42" fill-opacity="0.14"/>
    <text x="180" y="442" font-size="20" font-weight="700" text-anchor="middle">完成したアプリ（あとで作る）</text>
    <rect x="40" y="478" width="280" height="48" rx="14" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2"/>
    <text x="180" y="508" font-size="18" font-weight="700" text-anchor="middle">画面（HTML・CSS）</text>
    <rect x="40" y="538" width="280" height="48" rx="14" fill="#FFFFFF" stroke="#FFD166" stroke-width="2"/>
    <text x="180" y="568" font-size="18" font-weight="700" text-anchor="middle">動き（JavaScript）</text>
    <rect x="40" y="598" width="280" height="48" rx="14" fill="#FFFFFF" stroke="#6FD49D" stroke-width="2"/>
    <text x="180" y="628" font-size="18" font-weight="700" text-anchor="middle">保存（サーバー・データ）</text>
    <circle cx="44" cy="672" r="5" fill="#FF8C42"/>
    <text x="60" y="678" font-size="18">押すと動く</text>
    <circle cx="44" cy="708" r="5" fill="#FF8C42"/>
    <text x="60" y="714" font-size="18">データが残る</text>

    <!-- 下の説明 -->
    <rect x="16" y="756" width="328" height="84" rx="16" fill="#FFFFFF" stroke="#6FD49D" stroke-width="2"/>
    <circle cx="40" cy="786" r="6" fill="#6FD49D"/>
    <text x="60" y="792" font-size="18" font-weight="700">先に画面を作ると、</text>
    <text x="60" y="820" font-size="18" font-weight="700">要件のずれに早く気づける</text>
  </g>
</svg>
