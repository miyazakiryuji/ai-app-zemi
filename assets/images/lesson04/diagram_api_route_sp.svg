<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1184" role="img" aria-labelledby="title desc">
  <title id="title">API 連携の形：画面 → 自分のサーバー → AI のサービス</title>
  <desc id="desc">画面は自分のサーバーに要求を送り、サーバーが .env にある API キーを付けて AI のサービスを呼ぶ。画面から AI のサービスを直接呼ぶ形は取らない、という図（スマートフォン向けの縦長版）。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4DA8FF"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#FF8C42"/>
    </marker>
  </defs>
  <rect width="360" height="1184" fill="#FFF9F0"/>

  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text x="16" y="40" font-size="22" font-weight="700">API 連携の形：</text>
    <text x="16" y="68" font-size="17" font-weight="700">画面 → 自分のサーバー → AI のサービス</text>

    <!-- 画面 -->
    <rect x="16" y="92" width="272" height="200" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <rect x="48" y="112" width="208" height="104" rx="10" fill="#F4F6FB" stroke="#5A6178" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="48" y="112" width="208" height="22" rx="10" fill="#5A6178" fill-opacity="0.18"/>
    <rect x="68" y="146" width="168" height="20" rx="6" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="68" y="176" width="140" height="30" rx="8" fill="#4DA8FF"/>
    <text x="138" y="197" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">今月を振り返る</text>
    <text x="152" y="252" font-size="20" font-weight="700" text-anchor="middle">画面（ブラウザ）</text>
    <text x="152" y="278" font-size="16" fill="#5A6178" text-anchor="middle">中身は誰でも見られる</text>

    <!-- 矢印：① 画面→サーバー ／ ④ サーバー→画面 -->
    <path d="M52 300V358" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect x="64" y="317" width="80" height="30" rx="15" fill="#4DA8FF" fill-opacity="0.12"/>
    <text x="104" y="338" font-size="16" font-weight="700" text-anchor="middle">① 要求</text>
    <path d="M176 364V306" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <rect x="188" y="317" width="80" height="30" rx="15" fill="#FF8C42" fill-opacity="0.12"/>
    <text x="228" y="338" font-size="16" font-weight="700" text-anchor="middle">④ 表示</text>

    <!-- 自分のサーバー -->
    <rect x="16" y="372" width="272" height="200" rx="18" fill="#FFFFFF" stroke="#FF8C42" stroke-width="2.5"/>
    <text x="152" y="406" font-size="20" font-weight="700" text-anchor="middle">自分のサーバー</text>
    <text x="152" y="432" font-size="16" fill="#5A6178" text-anchor="middle">自分の PC で動くプログラム</text>
    <rect x="36" y="448" width="232" height="108" rx="12" fill="#FFF9F0" stroke="#FFE2C7" stroke-width="2"/>
    <text x="52" y="476" font-size="18" font-weight="700">.env</text>
    <text x="52" y="502" font-size="16" fill="#5A6178">ANTHROPIC_API_KEY=</text>
    <rect x="52" y="511" width="180" height="12" rx="6" fill="#ECE9E4"/>
    <text x="52" y="545" font-size="16" fill="#5A6178" text-anchor="start">API キーはここにだけ置く</text>

    <!-- 矢印：② サーバー→AI ／ ③ AI→サーバー -->
    <path d="M52 580V638" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect x="64" y="597" width="100" height="30" rx="15" fill="#4DA8FF" fill-opacity="0.12"/>
    <text x="114" y="618" font-size="16" font-weight="700" text-anchor="middle">② キー付き</text>
    <path d="M176 644V586" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <rect x="188" y="597" width="88" height="30" rx="15" fill="#FF8C42" fill-opacity="0.12"/>
    <text x="232" y="618" font-size="16" font-weight="700" text-anchor="middle">③ 生成文</text>

    <!-- AI のサービス -->
    <rect x="16" y="652" width="272" height="184" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="152" cy="702" r="28" fill="#FFD166"/>
    <path d="M152 684V720M134 702H170M140 690L164 714M164 690L140 714" fill="none" stroke="#2A2F45" stroke-width="2.5" stroke-linecap="round"/>
    <text x="152" y="764" font-size="20" font-weight="700" text-anchor="middle">AI のサービス</text>
    <text x="152" y="790" font-size="16" fill="#5A6178" text-anchor="middle">Claude／OpenAI／Gemini</text>
    <text x="152" y="814" font-size="16" fill="#5A6178" text-anchor="middle">インターネット上</text>

    <!-- やらない形：画面から AI のサービスへ直接 -->
    <path d="M292 192H320V744H292" fill="none" stroke="#E5484D" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>
    <rect x="301" y="352" width="38" height="232" rx="19" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
    <path d="M313 366L327 380M327 366L313 380" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
    <text x="320" y="392" font-size="16" font-weight="700" fill="#E5484D" writing-mode="vertical-rl" style="writing-mode:vertical-rl">画面から直接呼ばない</text>

    <!-- 下の説明 -->
    <rect x="16" y="864" width="328" height="300" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="36" cy="894" r="9" fill="#6FD49D"/>
    <path d="M31.5 894H40.5M36 889.5V898.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="900" font-size="18" font-weight="700">API キーを使うのは</text>
    <text x="56" y="926" font-size="18" font-weight="700">自分のサーバーだけ。</text>
    <text x="56" y="952" font-size="18" font-weight="700">画面のコードにキーを書かない</text>
    <text x="32" y="988" font-size="16" fill="#5A6178">画面のコードは開発者ツールで</text>
    <text x="32" y="1012" font-size="16" fill="#5A6178">誰でも読める。</text>
    <text x="32" y="1036" font-size="16" fill="#5A6178">そこにキーがあると、他人が</text>
    <text x="32" y="1060" font-size="16" fill="#5A6178">自分の請求でサービスを使える</text>
    <text x="32" y="1094" font-size="16" fill="#5A6178">サーバーが間にあれば、</text>
    <text x="32" y="1118" font-size="16" fill="#5A6178">AI のサービスを別のものに</text>
    <text x="32" y="1142" font-size="16" fill="#5A6178">変えても画面側は直さなくてよい</text>
  </g>
</svg>
