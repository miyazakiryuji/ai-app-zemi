<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2284" role="img" aria-labelledby="title desc">
  <title id="title">データの4つの置き場と、消える条件</title>
  <desc id="desc">ブラウザの中、自分の PC のフォルダ、インターネット上のデータベース、スプレッドシートの4つの置き場を、どこにあるか・消える条件・設定の手間・向いている場面で比べた図（スマートフォン向けの縦長版）。</desc>

  <rect width="360" height="2284" fill="#FFF9F0"/>

  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text x="16" y="40" font-size="22" font-weight="700">データの4つの置き場と、</text>
    <text x="16" y="70" font-size="22" font-weight="700">消える条件</text>

    <!-- 帯：自分の PC の中 -->
    <rect x="16" y="92" width="328" height="34" rx="17" fill="#4DA8FF" fill-opacity="0.12"/>
    <text x="180" y="115" font-size="16" font-weight="700" fill="#1F6FB8" text-anchor="middle">自分の PC の中</text>

    <!-- カード1：ブラウザの中 -->
    <rect x="16" y="140" width="328" height="444" rx="18" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2"/>
    <path d="M17 220V158A17 17 0 0 1 34 141H326A17 17 0 0 1 343 158V220Z" fill="#4DA8FF" fill-opacity="0.10"/>
    <text x="32" y="176" font-size="20" font-weight="700">ブラウザの中</text>
    <text x="32" y="202" font-size="16" fill="#5A6178">localStorage</text>
    <rect x="130" y="236" width="100" height="64" rx="8" fill="#F4F6FB" stroke="#5A6178" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="130" y="236" width="100" height="15" rx="8" fill="#5A6178" fill-opacity="0.18"/>
    <rect x="144" y="262" width="72" height="8" rx="4" fill="#4DA8FF" fill-opacity="0.5"/>
    <rect x="144" y="278" width="72" height="8" rx="4" fill="#4DA8FF" fill-opacity="0.5"/>
    <text x="32" y="340" font-size="16" font-weight="700" fill="#5A6178">消える条件</text>
    <text x="32" y="366" font-size="16">履歴・サイトデータの削除</text>
    <text x="32" y="390" font-size="16">別ブラウザ・別 PC では</text>
    <text x="32" y="414" font-size="16">最初から見えない</text>
    <text x="32" y="450" font-size="16" font-weight="700" fill="#5A6178">設定の手間</text>
    <text x="32" y="476" font-size="16">ゼロ</text>
    <text x="32" y="512" font-size="16" font-weight="700" fill="#5A6178">向いている場面</text>
    <text x="32" y="538" font-size="16">試作・表示の設定</text>
    <text x="32" y="562" font-size="16">PC 1台で自分だけ</text>

    <!-- カード2：PC のファイル -->
    <rect x="16" y="600" width="328" height="444" rx="18" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2"/>
    <path d="M17 680V618A17 17 0 0 1 34 601H326A17 17 0 0 1 343 618V680Z" fill="#4DA8FF" fill-opacity="0.10"/>
    <text x="32" y="636" font-size="20" font-weight="700">PC のファイル</text>
    <text x="32" y="662" font-size="16" fill="#5A6178">JSON ファイル／SQLite</text>
    <path d="M122 696H152L162 708H238A8 8 0 0 1 246 716V752A8 8 0 0 1 238 760H122A8 8 0 0 1 114 752V704A8 8 0 0 1 122 696Z" fill="#FFF9F0" stroke="#FF8C42" stroke-width="2"/>
    <text x="180" y="743" font-size="16" font-weight="700" text-anchor="middle">data/app.db</text>
    <text x="32" y="800" font-size="16" font-weight="700" fill="#5A6178">消える条件</text>
    <text x="32" y="826" font-size="16">フォルダの削除・PC の故障</text>
    <text x="32" y="850" font-size="16">公開先に置き直すたびに</text>
    <text x="32" y="874" font-size="16">初期状態に戻る</text>
    <text x="32" y="910" font-size="16" font-weight="700" fill="#5A6178">設定の手間</text>
    <text x="32" y="936" font-size="16">少ない</text>
    <text x="32" y="972" font-size="16" font-weight="700" fill="#5A6178">向いている場面</text>
    <text x="32" y="998" font-size="16">自分の PC だけで使う</text>
    <text x="32" y="1022" font-size="16">中身をファイルで確かめたい</text>

    <!-- 帯：自分の PC の外 -->
    <rect x="16" y="1070" width="328" height="34" rx="17" fill="#FF8C42" fill-opacity="0.12"/>
    <text x="180" y="1093" font-size="16" font-weight="700" fill="#B84A00" text-anchor="middle">自分の PC の外（インターネット上）</text>

    <!-- カード3：データベース -->
    <rect x="16" y="1118" width="328" height="444" rx="18" fill="#FFFFFF" stroke="#FF8C42" stroke-width="2.5"/>
    <path d="M17 1198V1136A17 17 0 0 1 34 1119H326A17 17 0 0 1 343 1136V1198Z" fill="#FF8C42" fill-opacity="0.10"/>
    <text x="32" y="1154" font-size="20" font-weight="700">データベース</text>
    <text x="32" y="1180" font-size="16" fill="#5A6178">Turso</text>
    <ellipse cx="180" cy="1224" rx="36" ry="10" fill="#FFF9F0" stroke="#FF8C42" stroke-width="2"/>
    <path d="M144 1224V1268A36 10 0 0 0 216 1268V1224" fill="#FFF9F0" stroke="#FF8C42" stroke-width="2"/>
    <path d="M144 1246A36 10 0 0 0 216 1246" fill="none" stroke="#FF8C42" stroke-width="2"/>
    <text x="32" y="1318" font-size="16" font-weight="700" fill="#5A6178">消える条件</text>
    <text x="32" y="1344" font-size="16">管理画面で削除したとき</text>
    <text x="32" y="1368" font-size="16">契約が止まったとき</text>
    <text x="32" y="1392" font-size="16" font-weight="700">置き直しても消えない</text>
    <text x="32" y="1428" font-size="16" font-weight="700" fill="#5A6178">設定の手間</text>
    <text x="32" y="1454" font-size="16">中くらい（接続情報を .env へ）</text>
    <text x="32" y="1490" font-size="16" font-weight="700" fill="#5A6178">向いている場面</text>
    <text x="32" y="1516" font-size="16">公開してスマホからも使う</text>
    <text x="32" y="1540" font-size="16">PC を替えても続ける</text>

    <!-- カード4：スプレッドシート -->
    <rect x="16" y="1578" width="328" height="444" rx="18" fill="#FFFFFF" stroke="#FF8C42" stroke-width="2"/>
    <path d="M17 1658V1596A17 17 0 0 1 34 1579H326A17 17 0 0 1 343 1596V1658Z" fill="#FF8C42" fill-opacity="0.10"/>
    <text x="32" y="1614" font-size="20" font-weight="700">スプレッドシート</text>
    <text x="32" y="1640" font-size="16" fill="#5A6178">Google スプレッドシート</text>
    <rect x="130" y="1674" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#6FD49D" stroke-width="2"/>
    <path d="M130 1690H230M130 1706H230M130 1722H230M163 1674V1738M196 1674V1738" fill="none" stroke="#6FD49D" stroke-width="1.5"/>
    <rect x="130" y="1674" width="100" height="16" rx="6" fill="#6FD49D" fill-opacity="0.35"/>
    <text x="32" y="1778" font-size="16" font-weight="700" fill="#5A6178">消える条件</text>
    <text x="32" y="1804" font-size="16">シートの削除・共有の解除</text>
    <text x="32" y="1828" font-size="16">列や項目名を手で変えると</text>
    <text x="32" y="1852" font-size="16">アプリが読めなくなる</text>
    <text x="32" y="1888" font-size="16" font-weight="700" fill="#5A6178">設定の手間</text>
    <text x="32" y="1914" font-size="16">多い（Google Cloud の設定）</text>
    <text x="32" y="1950" font-size="16" font-weight="700" fill="#5A6178">向いている場面</text>
    <text x="32" y="1976" font-size="16">表を人が眺めて直す</text>
    <text x="32" y="2000" font-size="16">家族・同僚と共有する</text>

    <!-- 下の説明 -->
    <rect x="16" y="2046" width="328" height="218" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="36" cy="2076" r="9" fill="#6FD49D"/>
    <path d="M31.5 2076H40.5M36 2071.5V2080.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="2082" font-size="17" font-weight="700">「誰が、どこから使うか」で選ぶ。</text>
    <text x="56" y="2108" font-size="17" font-weight="700">保存の処理は1つのファイルに</text>
    <text x="56" y="2134" font-size="17" font-weight="700">まとめておく</text>
    <text x="32" y="2170" font-size="16" fill="#5A6178">自分の PC だけ → PC のファイル</text>
    <text x="32" y="2194" font-size="16" fill="#5A6178">公開して外からも使う → データベース</text>
    <text x="32" y="2218" font-size="16" fill="#5A6178">表を人が直す → スプレッドシート</text>
    <text x="32" y="2242" font-size="16" fill="#5A6178">試作 → ブラウザ</text>
  </g>
</svg>
