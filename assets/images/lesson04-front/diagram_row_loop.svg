<svg id="diagram-row-loop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">動きは1行ずつ足す</title>
  <desc id="svg-desc">docs/actions.md の未着手行を上から一つずつ指示し、確認してから次へ進む5段階を時計回りに循環する図。</desc>
  <defs id="diagram-definitions"><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path id="arrow-gray-tip" d="M0 0L10 5L0 10Z" fill="#5A6178"/></marker></defs>
  <rect id="canvas" x="0" y="0" width="960" height="540" fill="#FFF9F0"/>
  <g id="diagram-content" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">

<text id="main-title" x="28" y="38" font-size="22" font-weight="700">動きは1行ずつ足す</text>
<path id="step-1-to-2" d="M608 150Q640 172 676 192" fill="none" stroke="#5A6178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<path id="step-2-to-3" d="M800 298V328" fill="none" stroke="#5A6178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<path id="step-3-to-4" d="M650 425H334" fill="none" stroke="#5A6178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<path id="step-4-to-5" d="M100 328V300" fill="none" stroke="#5A6178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<path id="step-5-to-1" d="M267 186Q310 132 352 132" fill="none" stroke="#5A6178" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<path id="debug-branch" d="M160 440V463" fill="none" stroke="#5A6178" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
<text id="debug-branch-label" x="178" y="472" font-size="14" font-weight="700" fill="#5A6178"><tspan id="debug-branch-label-line-1" x="178" y="472.0">動かないとき → コンソールの</tspan><tspan id="debug-branch-label-line-2" x="178" y="490.2">赤い文字をスクショで渡す</tspan></text>
<g id="step-1" role="group" aria-labelledby="step-1-title" aria-describedby="step-1-desc"><rect id="step-1-box" x="352" y="78" width="256" height="112" rx="16" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2.5"/><circle id="step-1-number-circle" cx="368" cy="94" r="15" fill="#4DA8FF"/><text id="step-1-number" x="368" y="100" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text id="step-1-title" x="392" y="110" font-size="18" font-weight="700">選ぶ</text>
<text id="step-1-desc" x="368" y="143" font-size="14" fill="#2A2F45"><tspan id="step-1-desc-line-1" x="368" y="143.0">docs/actions.md の「まだ」のうち、</tspan><tspan id="step-1-desc-line-2" x="368" y="161.2">いちばん上の行</tspan></text>
</g>
<g id="step-2" role="group" aria-labelledby="step-2-title" aria-describedby="step-2-desc"><rect id="step-2-box" x="676" y="186" width="250" height="112" rx="16" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2.5"/><circle id="step-2-number-circle" cx="692" cy="202" r="15" fill="#4DA8FF"/><text id="step-2-number" x="692" y="208" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text id="step-2-title" x="716" y="218" font-size="18" font-weight="700">頼む</text>
<text id="step-2-desc" x="692" y="251" font-size="14" fill="#2A2F45"><tspan id="step-2-desc-line-1" x="692" y="251.0">いつもの型の指示を、</tspan><tspan id="step-2-desc-line-2" x="692" y="269.2">そのまま送る</tspan></text>
</g>
<g id="step-3" role="group" aria-labelledby="step-3-title" aria-describedby="step-3-desc"><rect id="step-3-box" x="650" y="328" width="276" height="112" rx="16" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2.5"/><circle id="step-3-number-circle" cx="666" cy="344" r="15" fill="#4DA8FF"/><text id="step-3-number" x="666" y="350" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text id="step-3-title" x="690" y="360" font-size="18" font-weight="700">許可する</text>
<text id="step-3-desc" x="666" y="393" font-size="14" fill="#2A2F45"><tspan id="step-3-desc-line-1" x="666" y="393.0">確認画面で、変わるファイルと</tspan><tspan id="step-3-desc-line-2" x="666" y="411.2">中身を見てから</tspan></text>
</g>
<g id="step-4" role="group" aria-labelledby="step-4-title" aria-describedby="step-4-desc"><rect id="step-4-box" x="34" y="328" width="300" height="112" rx="16" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2.5"/><circle id="step-4-number-circle" cx="50" cy="344" r="15" fill="#4DA8FF"/><text id="step-4-number" x="50" y="350" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text id="step-4-title" x="74" y="360" font-size="18" font-weight="700">確かめる</text>
<text id="step-4-desc" x="50" y="393" font-size="14" fill="#2A2F45"><tspan id="step-4-desc-line-1" x="50" y="393.0">ブラウザで再読み込みして、</tspan><tspan id="step-4-desc-line-2" x="50" y="411.2">その行の「確かめ方」を試す</tspan></text>
</g>
<g id="step-5" role="group" aria-labelledby="step-5-title" aria-describedby="step-5-desc"><rect id="step-5-box" x="34" y="186" width="270" height="112" rx="16" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2.5"/><circle id="step-5-number-circle" cx="50" cy="202" r="15" fill="#4DA8FF"/><text id="step-5-number" x="50" y="208" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text id="step-5-title" x="74" y="218" font-size="18" font-weight="700">前の動きも押す</text>
<text id="step-5-desc" x="50" y="251" font-size="14" fill="#2A2F45"><tspan id="step-5-desc-line-1" x="50" y="251.0">壊れていなければ、その行を</tspan><tspan id="step-5-desc-line-2" x="50" y="269.2">「作った」に</tspan></text>
</g>
<text id="center-message" x="480" y="260" font-size="19" font-weight="700" fill="#FF8C42" text-anchor="middle">1回の指示で、動きは1つ</text>
  </g>
</svg>
