<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">my-appフォルダとClaude Codeの読み書きの関係</title>
  <desc id="desc">デスクトップ上のmy-appフォルダをClaude Codeが読み、ファイルを作成または書き換える関係を示す図。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4DA8FF"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF8C42"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#FFF9F0"/>
  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text x="36" y="44" font-size="24" font-weight="700">開いたフォルダと Claude Code</text>

    <rect x="36" y="70" width="390" height="300" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <text x="62" y="106" font-size="18" fill="#5A6178">デスクトップ</text>
    <path d="M64 132h54l12 13h258a12 12 0 0 1 12 12v190a12 12 0 0 1-12 12H64a12 12 0 0 1-12-12V144a12 12 0 0 1 12-12Z" fill="#FFF9F0" stroke="#FF8C42" stroke-width="2.5"/>
    <text x="76" y="174" font-size="22" font-weight="700">my-app/</text>

    <path d="M91 190v132M91 214h18M91 322h18" fill="none" stroke="#5A6178" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="110" y="194" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2"/>
    <text x="128" y="222" font-size="20" font-weight="700">docs/</text>
    <text x="130" y="250" font-size="18">├─ spec.md</text>
    <text x="268" y="250" font-size="14" fill="#5A6178">仕様書</text>
    <text x="130" y="274" font-size="18">└─ tasks.md</text>
    <text x="268" y="274" font-size="14" fill="#5A6178">作る順番</text>

    <rect x="110" y="298" width="166" height="48" rx="14" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="128" y="328" font-size="20" font-weight="700" fill="#5A6178">app/</text>
    <text x="292" y="316" font-size="15" fill="#5A6178">アプリ本体</text>
    <text x="292" y="337" font-size="15" fill="#5A6178">作り始めてから</text>

    <rect x="646" y="125" width="270" height="180" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="781" cy="169" r="26" fill="#FFD166"/>
    <path d="M767 169h28M781 155v28" stroke="#2A2F45" stroke-width="3" stroke-linecap="round"/>
    <text x="781" y="222" font-size="24" font-weight="700" text-anchor="middle">Claude Code</text>
    <text x="781" y="252" font-size="18" fill="#5A6178" text-anchor="middle">フォルダを開いて作業する</text>

    <path d="M426 160 C500 125 565 125 635 160" fill="none" stroke="#4DA8FF" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="493" y="111" width="74" height="34" rx="17" fill="#4DA8FF" fill-opacity="0.12"/>
    <text x="530" y="134" font-size="18" font-weight="700" fill="#2A2F45" text-anchor="middle">読む</text>

    <path d="M646 275 C566 326 500 326 438 276" fill="none" stroke="#FF8C42" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <rect x="476" y="304" width="168" height="36" rx="18" fill="#FF8C42" fill-opacity="0.12"/>
    <text x="560" y="328" font-size="18" font-weight="700" text-anchor="middle">作る・書き換える</text>

    <rect x="98" y="392" width="764" height="48" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="130" cy="416" r="8" fill="#6FD49D"/>
    <text x="154" y="423" font-size="20" font-weight="700">Claude Code は、開いたフォルダの中だけでファイルを読み書きする</text>
  </g>
</svg>
