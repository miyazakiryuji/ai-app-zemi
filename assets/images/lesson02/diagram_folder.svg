<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">開いたフォルダと Claude Code</title>
  <desc id="desc">デスクトップにあるmy-appフォルダのファイルを、Claude Codeが読み、作成または書き換える関係を示す図。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#4DA8FF"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#FF8C42"/>
    </marker>
  </defs>

  <rect width="960" height="500" fill="#FFF9F0"/>

  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text x="36" y="42" font-size="24" font-weight="700">開いたフォルダと Claude Code</text>

    <rect x="28" y="64" width="430" height="346" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <text x="52" y="98" font-size="18" fill="#5A6178">デスクトップ</text>

    <path d="M64 118H150L164 134H426A16 16 0 0 1 442 150V378A16 16 0 0 1 426 394H64A16 16 0 0 1 48 378V134A16 16 0 0 1 64 118Z" fill="#FFF9F0" stroke="#FF8C42" stroke-width="2.5"/>
    <text x="72" y="160" font-size="22" font-weight="700">my-app/</text>

    <path d="M72 178V350M72 200H82M72 342H82" fill="none" stroke="#5A6178" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

    <rect x="88" y="176" width="338" height="130" rx="14" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2"/>
    <text x="112" y="210" font-size="20" font-weight="700">docs/</text>
    <text x="112" y="246" font-size="18">├─ spec.md</text>
    <text x="280" y="246" font-size="16" fill="#5A6178">仕様書</text>
    <text x="112" y="282" font-size="18">└─ tasks.md</text>
    <text x="280" y="282" font-size="16" fill="#5A6178">作る順番</text>

    <rect x="88" y="322" width="338" height="56" rx="14" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="112" y="355" font-size="20" font-weight="700" fill="#5A6178">app/</text>
    <text x="208" y="354" font-size="15" fill="#5A6178">アプリ本体／作り始めてから</text>

    <rect x="666" y="118" width="266" height="192" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="799" cy="158" r="24" fill="#FFD166"/>
    <path d="M786 158H812M799 145V171" fill="none" stroke="#2A2F45" stroke-width="3" stroke-linecap="round"/>
    <text x="799" y="224" font-size="24" font-weight="700" text-anchor="middle">Claude Code</text>
    <text x="799" y="266" font-size="18" fill="#5A6178" text-anchor="middle">フォルダを開いて作業する</text>

    <path d="M474 182H650" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect x="528" y="108" width="68" height="54" rx="18" fill="#4DA8FF" fill-opacity="0.12"/>
    <text x="562" y="140" font-size="18" font-weight="700" text-anchor="middle">読む</text>

    <path d="M650 274H474" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <rect x="474" y="304" width="176" height="54" rx="18" fill="#FF8C42" fill-opacity="0.12"/>
    <text x="562" y="337" font-size="18" font-weight="700" text-anchor="middle">作る・書き換える</text>

    <rect x="54" y="426" width="852" height="54" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="78" cy="453" r="8" fill="#6FD49D"/>
    <path d="M74 453H82M78 449V457" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="104" y="459" font-size="20" font-weight="700">Claude Code は、開いたフォルダの中だけでファイルを読み書きする</text>
  </g>
</svg>
