<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 990" role="img" aria-labelledby="title desc">
<title id="title">開いたフォルダと Claude Code</title><desc id="desc">デスクトップにあるmy-appフォルダのファイルを、Claude Codeが読み、作成または書き換える関係を示す図。（スマートフォン向けの縦長版）</desc>
<defs><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#4DA8FF"/></marker><marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#FF8C42"/></marker></defs>
<rect width="360" height="990" fill="#FFF9F0"/><g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45"><text x="16" y="32" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >開いたフォルダと </text><text x="16" y="57" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >Claude Code</text><rect x="16" y="76" width="328" height="472" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><text x="32" y="105" font-size="17" fill="#5A6178" font-weight="400" text-anchor="start" >デスクトップ</text><path d="M48 120H130L142 134H316A12 12 0 0 1 328 146V526A12 12 0 0 1 316 538H44A12 12 0 0 1 32 526V132A12 12 0 0 1 44 120Z" fill="#FFF9F0" stroke="#FF8C42" stroke-width="2.5"/><text x="48" y="163" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >my-app/</text><rect x="48" y="180" width="264" height="176" rx="14" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2" /><text x="64" y="208" font-size="18" fill="#2A2F45" font-weight="700" text-anchor="start" >docs/</text><text font-size="15" fill="#2A2F45" font-weight="400" text-anchor="start"><tspan x="64" y="238">├─ spec.md</tspan><tspan x="64" y="259">仕様書</tspan></text><text font-size="15" fill="#2A2F45" font-weight="400" text-anchor="start"><tspan x="64" y="286">└─ tasks.md</tspan><tspan x="64" y="307">作る順番</tspan></text><rect x="48" y="372" width="264" height="116" rx="14" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="7 6"/><text x="64" y="402" font-size="18" fill="#5A6178" font-weight="700" text-anchor="start" >app/</text><text font-size="15" fill="#5A6178" font-weight="400" text-anchor="start"><tspan x="64" y="430">アプリ本体／</tspan><tspan x="64" y="451">作り始めてから</tspan></text><rect x="44" y="710" width="272" height="134" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><circle cx="180" cy="740" r="18" fill="#FFD166"/><path d="M171 740H189M180 731V749" stroke="#2A2F45" stroke-width="2.5" stroke-linecap="round"/><text x="180" y="781" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="middle" >Claude Code</text><text font-size="15" fill="#5A6178" font-weight="400" text-anchor="middle"><tspan x="180" y="810">フォルダを開いて</tspan><tspan x="180" y="831">作業する</tspan></text><path d="M90 562V690" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="104" y="582" width="76" height="42" rx="14" fill="#4DA8FF" stroke="#4DA8FF" stroke-width="0" fill-opacity="0.12"/><text x="142" y="609" font-size="17" fill="#2A2F45" font-weight="700" text-anchor="middle" >読む</text><path d="M270 690V562" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#orange-arrow)"/><rect x="100" y="638" width="164" height="42" rx="14" fill="#FF8C42" stroke="#FF8C42" stroke-width="0" fill-opacity="0.12"/><text x="182" y="665" font-size="17" fill="#2A2F45" font-weight="700" text-anchor="middle" >作る・書き換える</text><rect x="16" y="870" width="328" height="112" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><text font-size="15" fill="#2A2F45" font-weight="700" text-anchor="start"><tspan x="32" y="898">Claude Code は、開いた</tspan><tspan x="32" y="920">フォルダの中だけで</tspan><tspan x="32" y="942">ファイルを読み書きする</tspan></text></g></svg>