<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">食費メモ：2つの画面と移動</title>
  <desc id="svg-desc">食費メモの記録画面と修正画面、それぞれの項目と二画面間の移動を示すワイヤーフレーム。</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#FF8C42"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#4DA8FF"/>
    </marker>
  </defs>

  <rect id="canvas" x="0" y="0" width="960" height="600" fill="#FFF9F0"/>

  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text id="main-title" x="480" y="35" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">食費メモ：2つの画面と移動</text>

    <text id="screen-1-title" x="205" y="73" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">画面1 記録画面</text>
    <rect id="screen-1-frame" x="20" y="94" width="370" height="402" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>

    <text id="month-label" x="44" y="124" font-size="18" font-weight="700" dominant-baseline="middle">今月の合計</text>
    <rect id="month-total-box" x="230" y="104" width="140" height="40" rx="12" fill="#FFD166" fill-opacity="0.18" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="month-total" x="300" y="124" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">12,800円</text>
    <line x1="44" y1="154" x2="370" y2="154" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>

    <text id="record-amount-label" x="44" y="180" font-size="17" dominant-baseline="middle">金額</text>
    <rect id="record-amount-input" x="116" y="161" width="254" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="record-date-label" x="44" y="222" font-size="17" dominant-baseline="middle">日付</text>
    <rect id="record-date-input" x="116" y="203" width="254" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="record-note-label" x="44" y="264" font-size="17" dominant-baseline="middle">メモ</text>
    <rect id="record-note-input" x="116" y="245" width="254" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <rect id="record-save-button" x="296" y="291" width="74" height="40" rx="12" fill="#FF8C42" fill-opacity="0.12" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="record-save-text" x="333" y="311" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">保存</text>

    <line x1="44" y1="340" x2="370" y2="340" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>

    <text id="record-row-1" x="44" y="367" font-size="17" dominant-baseline="middle">9/5 昼食 850円</text>
    <rect id="edit-button-1" x="202" y="348" width="74" height="38" rx="12" fill="#4DA8FF" fill-opacity="0.10" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-text-1" x="239" y="367" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">修正</text>
    <rect id="delete-button-1" x="288" y="348" width="74" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="delete-text-1" x="325" y="367" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">削除</text>

    <text id="record-row-2" x="44" y="417" font-size="17" dominant-baseline="middle">9/4 夕食 1,200円</text>
    <rect id="edit-button-2" x="202" y="398" width="74" height="38" rx="12" fill="#4DA8FF" fill-opacity="0.10" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-text-2" x="239" y="417" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">修正</text>
    <rect id="delete-button-2" x="288" y="398" width="74" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="delete-text-2" x="325" y="417" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">削除</text>

    <text id="record-row-3" x="44" y="467" font-size="17" dominant-baseline="middle">9/3 飲み物 180円</text>
    <rect id="edit-button-3" x="202" y="448" width="74" height="38" rx="12" fill="#4DA8FF" fill-opacity="0.10" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-text-3" x="239" y="467" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">修正</text>
    <rect id="delete-button-3" x="288" y="448" width="74" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="delete-text-3" x="325" y="467" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">削除</text>

    <text id="screen-2-title" x="765" y="73" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">画面2 修正画面</text>
    <rect id="screen-2-frame" x="590" y="94" width="350" height="402" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>

    <text id="edit-heading" x="614" y="124" font-size="20" font-weight="700" dominant-baseline="middle">記録を修正</text>
    <line x1="614" y1="154" x2="916" y2="154" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-amount-label" x="614" y="190" font-size="17" dominant-baseline="middle">金額</text>
    <rect id="edit-amount-input" x="682" y="171" width="234" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-date-label" x="614" y="240" font-size="17" dominant-baseline="middle">日付</text>
    <rect id="edit-date-input" x="682" y="221" width="234" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-note-label" x="614" y="290" font-size="17" dominant-baseline="middle">メモ</text>
    <rect id="edit-note-input" x="682" y="271" width="234" height="38" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <rect id="edit-save-button" x="705" y="329" width="74" height="40" rx="12" fill="#FF8C42" fill-opacity="0.12" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="edit-save-text" x="742" y="349" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">保存</text>
    <rect id="cancel-button" x="791" y="329" width="125" height="40" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/>
    <text id="cancel-text" x="853.5" y="349" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">キャンセル</text>

    <rect id="forward-label-box" x="418" y="125" width="144" height="42" rx="15" fill="#FF8C42" fill-opacity="0.12"/>
    <text id="forward-label" x="490" y="146" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">修正を押す</text>
    <path id="forward-arrow" d="M402 190H578" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

    <path id="return-arrow" d="M578 336H402" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect id="return-label-box" x="398" y="365" width="184" height="68" rx="15" fill="#4DA8FF" fill-opacity="0.12"/>
    <text id="return-label-1" x="490" y="388" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">保存／キャンセル</text>
    <text id="return-label-2" x="490" y="414" font-size="15" fill="#5A6178" text-anchor="middle" dominant-baseline="middle">画面1へ戻る</text>

    <rect id="stay-note-box" x="52" y="508" width="856" height="48" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="78" cy="532" r="7" fill="#6FD49D"/>
    <text id="stay-note" x="98" y="532" font-size="18" font-weight="700" dominant-baseline="middle">保存と削除は画面1の中で完結し、画面は移動しない</text>

    <text id="wireframe-note" x="480" y="582" font-size="15" fill="#5A6178" text-anchor="middle" dominant-baseline="middle">ワイヤーフレーム＝色や装飾を付けずに、どこに何を置くかだけを描いた骨組み</text>
  </g>
</svg>
