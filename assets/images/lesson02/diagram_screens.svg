<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">食費メモの記録画面と修正画面の画面遷移</title>
  <desc id="desc">記録画面から修正画面へ移動し、保存またはキャンセルで記録画面へ戻る二画面のワイヤーフレーム。</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF8C42"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4DA8FF"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#FFF9F0"/>
  <g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45">
    <text x="480" y="35" font-size="24" font-weight="700" text-anchor="middle">食費メモ：2つの画面と移動</text>

    <text x="210" y="66" font-size="22" font-weight="700" text-anchor="middle">画面1　記録画面</text>
    <rect x="38" y="80" width="344" height="352" rx="18" fill="#FFFFFF" stroke="#5A6178" stroke-width="2"/>
    <text x="58" y="112" font-size="18" font-weight="700">今月の合計</text>
    <rect x="214" y="94" width="146" height="27" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="348" y="114" font-size="16" text-anchor="end">12,800円</text>
    <line x1="58" y1="133" x2="360" y2="133" stroke="#5A6178" stroke-opacity="0.45" stroke-width="2"/>

    <text x="58" y="162" font-size="17">金額</text>
    <rect x="128" y="143" width="232" height="28" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="58" y="199" font-size="17">日付</text>
    <rect x="128" y="180" width="232" height="28" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="58" y="236" font-size="17">メモ</text>
    <rect x="128" y="217" width="232" height="28" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <rect x="270" y="258" width="90" height="32" rx="9" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="315" y="280" font-size="17" font-weight="700" text-anchor="middle">保存</text>

    <line x1="58" y1="306" x2="360" y2="306" stroke="#5A6178" stroke-opacity="0.45" stroke-width="2"/>
    <text x="58" y="330" font-size="16">9/5　昼食　850円</text>
    <text x="270" y="330" font-size="15">修正</text>
    <text x="324" y="330" font-size="15">削除</text>
    <line x1="58" y1="340" x2="360" y2="340" stroke="#5A6178" stroke-opacity="0.30"/>
    <text x="58" y="365" font-size="16">9/4　夕食　1,200円</text>
    <text x="270" y="365" font-size="15">修正</text>
    <text x="324" y="365" font-size="15">削除</text>
    <line x1="58" y1="375" x2="360" y2="375" stroke="#5A6178" stroke-opacity="0.30"/>
    <text x="58" y="400" font-size="16">9/3　飲み物　180円</text>
    <text x="270" y="400" font-size="15">修正</text>
    <text x="324" y="400" font-size="15">削除</text>

    <text x="750" y="66" font-size="22" font-weight="700" text-anchor="middle">画面2　修正画面</text>
    <rect x="578" y="80" width="344" height="352" rx="18" fill="#FFFFFF" stroke="#5A6178" stroke-width="2"/>
    <text x="598" y="118" font-size="19" font-weight="700">記録を修正</text>
    <line x1="598" y1="133" x2="902" y2="133" stroke="#5A6178" stroke-opacity="0.45" stroke-width="2"/>
    <text x="598" y="172" font-size="17">金額</text>
    <rect x="668" y="151" width="234" height="32" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="598" y="222" font-size="17">日付</text>
    <rect x="668" y="201" width="234" height="32" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="598" y="272" font-size="17">メモ</text>
    <rect x="668" y="251" width="234" height="32" rx="7" fill="none" stroke="#5A6178" stroke-width="2"/>
    <rect x="668" y="310" width="108" height="38" rx="10" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="722" y="335" font-size="17" font-weight="700" text-anchor="middle">保存</text>
    <rect x="788" y="310" width="114" height="38" rx="10" fill="none" stroke="#5A6178" stroke-width="2"/>
    <text x="845" y="335" font-size="17" font-weight="700" text-anchor="middle">キャンセル</text>

    <path d="M382 170 C437 142 514 142 566 170" fill="none" stroke="#FF8C42" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <rect x="405" y="110" width="138" height="34" rx="17" fill="#FF8C42" fill-opacity="0.12"/>
    <text x="474" y="133" font-size="17" font-weight="700" text-anchor="middle">修正を押す</text>
    <path d="M578 300 C516 334 444 334 394 300" fill="none" stroke="#4DA8FF" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="395" y="337" width="176" height="54" rx="15" fill="#4DA8FF" fill-opacity="0.12"/>
    <text x="483" y="359" font-size="16" font-weight="700" text-anchor="middle">保存／キャンセル</text>
    <text x="483" y="380" font-size="15" fill="#5A6178" text-anchor="middle">画面1へ戻る</text>

    <rect x="73" y="451" width="814" height="38" rx="14" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2"/>
    <circle cx="99" cy="470" r="7" fill="#6FD49D"/>
    <text x="119" y="477" font-size="18" font-weight="700">保存と削除は画面1の中で完結し、画面は移動しない</text>
    <text x="480" y="510" font-size="15" fill="#5A6178" text-anchor="middle">ワイヤーフレーム＝色や装飾を付けずに、どこに何を置くかだけを描いた骨組み</text>
  </g>
</svg>
