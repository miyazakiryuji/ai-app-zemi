<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1328" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">AI の提案を仕分けて、MVP を決める</title><desc id="svg-desc">自分が書いた四つの内容から AI の提案を作り、必須とあとまわしに仕分けて MVP を決める流れと、その判断基準を示す図。（スマートフォン向けの縦長版）</desc>
<defs><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#4DA8FF"/></marker><marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#FF8C42"/></marker></defs>
<rect width="360" height="1328" fill="#FFF9F0"/><g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45"><text x="16" y="30" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >AI の提案を仕分けて、</text><text x="16" y="55" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >MVP を決める</text><text x="344" y="82" font-size="15" fill="#5A6178" font-weight="700" text-anchor="end" >決めるのは自分</text><rect x="16" y="96" width="328" height="226" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><rect x="32" y="112" width="296" height="42" rx="12" fill="#4DA8FF" stroke="#4DA8FF" stroke-width="0" fill-opacity="0.12"/><text x="180" y="140" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="middle" >自分が書いた4つ</text><rect x="32" y="166" width="296" height="30" rx="11" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2" /><text x="180" y="188" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >誰が使うか</text><rect x="32" y="202" width="296" height="30" rx="11" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2" /><text x="180" y="224" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >どんなアプリか</text><rect x="32" y="238" width="296" height="30" rx="11" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2" /><text x="180" y="260" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >欲しい機能</text><rect x="32" y="274" width="296" height="30" rx="11" fill="#FFFFFF" stroke="#4DA8FF" stroke-width="2" /><text x="180" y="296" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >やらないこと</text><path d="M180 330V354" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="16" y="362" width="328" height="290" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><rect x="32" y="378" width="296" height="42" rx="12" fill="#FFD166" stroke="#FFD166" stroke-width="0" fill-opacity="0.24"/><text x="180" y="406" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="middle" >AI の提案</text><rect x="32" y="432" width="296" height="34" rx="11" fill="#FFFFFF" stroke="#FFD166" stroke-width="2" /><text x="180" y="455" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >入力の修正・削除</text><rect x="32" y="472" width="296" height="34" rx="11" fill="#FFFFFF" stroke="#FFD166" stroke-width="2" /><text x="180" y="495" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >スマホ最適化</text><rect x="32" y="512" width="296" height="34" rx="11" fill="#FFFFFF" stroke="#FFD166" stroke-width="2" /><text x="180" y="535" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >閉じても消えない</text><rect x="32" y="552" width="296" height="34" rx="11" fill="#FFFFFF" stroke="#FFD166" stroke-width="2" /><text x="180" y="575" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >月の切り替え</text><rect x="32" y="592" width="296" height="34" rx="11" fill="#FFFFFF" stroke="#FFD166" stroke-width="2" /><text x="180" y="615" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="middle" >CSV 書き出し</text><path d="M180 660V684" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#orange-arrow)"/><path d="M328 640H336V962H322" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange-arrow)"/><rect x="40" y="692" width="280" height="150" rx="18" fill="#FFFFFF" stroke="#FF8C42" stroke-width="3" /><rect x="56" y="708" width="84" height="36" rx="14" fill="#FF8C42" stroke="#FF8C42" stroke-width="0" /><text x="98" y="733" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" >必須</text><text font-size="16" fill="#2A2F45" font-weight="700" text-anchor="start"><tspan x="56" y="772">無いと1回も</tspan><tspan x="56" y="794">使えない</tspan></text><text x="56" y="824" font-size="16" fill="#FF8C42" font-weight="700" text-anchor="start" >MVP に入れる</text><rect x="40" y="882" width="280" height="158" rx="18" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.55"/><rect x="56" y="898" width="132" height="36" rx="14" fill="#5A6178" stroke="#5A6178" stroke-width="0" fill-opacity="0.14"/><text x="122" y="923" font-size="16" fill="#5A6178" font-weight="700" text-anchor="middle" >あとまわし</text><text font-size="16" fill="#2A2F45" font-weight="700" text-anchor="start"><tspan x="56" y="962">無くても1回</tspan><tspan x="56" y="984">使える</tspan></text><text font-size="15" fill="#5A6178" font-weight="700" text-anchor="start"><tspan x="56" y="1010">仕様書の『やらない</tspan><tspan x="56" y="1030">こと』へ</tspan></text><rect x="16" y="1060" width="328" height="252" rx="18" fill="#FFFFFF" stroke="#6FD49D" stroke-width="3" /><text x="32" y="1090" font-size="20" fill="#5A6178" font-weight="700" text-anchor="start" >判断基準</text><text font-size="15" fill="#2A2F45" font-weight="700" text-anchor="start"><tspan x="32" y="1122">① 目的の流れを</tspan><tspan x="32" y="1143">最後まで通すのに</tspan><tspan x="32" y="1164">必要か</tspan></text><text font-size="15" fill="#2A2F45" font-weight="700" text-anchor="start"><tspan x="32" y="1190">② 無いと、間違った</tspan><tspan x="32" y="1211">結果が出る・データが</tspan><tspan x="32" y="1232">消える・危ない、の</tspan><tspan x="32" y="1253">どれかが起きるか</tspan></text></g></svg>