<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1380" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">食費メモ：2つの画面と移動</title><desc id="svg-desc">食費メモの記録画面と修正画面、それぞれの項目と二画面間の移動を示すワイヤーフレーム。（スマートフォン向けの縦長版）</desc>
<defs><marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#4DA8FF"/></marker><marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#FF8C42"/></marker></defs>
<rect width="360" height="1380" fill="#FFF9F0"/><g font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif" fill="#2A2F45"><text x="16" y="30" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >食費メモ：2つの画面と移動</text><text x="180" y="68" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="middle" >画面1 記録画面</text><rect x="16" y="84" width="328" height="490" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><text x="32" y="116" font-size="16" fill="#2A2F45" font-weight="700" text-anchor="start" >今月の合計</text><rect x="205" y="94" width="123" height="38" rx="12" fill="#FFD166" stroke="#5A6178" stroke-width="2" fill-opacity="0.18" stroke-opacity="0.5"/><text x="266" y="119" font-size="16" fill="#2A2F45" font-weight="700" text-anchor="middle" >12,800円</text><line x1="32" y1="132" x2="328" y2="132" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/><text x="32" y="161" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="start" >金額</text><rect x="32" y="167" width="296" height="30" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="32" y="215" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="start" >日付</text><rect x="32" y="221" width="296" height="30" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="32" y="269" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="start" >メモ</text><rect x="32" y="275" width="296" height="30" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><rect x="238" y="318" width="90" height="38" rx="12" fill="#FF8C42" stroke="#5A6178" stroke-width="2" fill-opacity="0.12" stroke-opacity="0.5"/><text x="283" y="343" font-size="16" fill="#2A2F45" font-weight="700" text-anchor="middle" >保存</text><line x1="32" y1="368" x2="328" y2="368" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/><text x="32" y="403" font-size="15" fill="#2A2F45" font-weight="400" text-anchor="start" >9/5 昼食 850円</text><rect x="192" y="382" width="64" height="36" rx="10" fill="#4DA8FF" stroke="#5A6178" stroke-width="2" fill-opacity="0.10" stroke-opacity="0.5"/><text x="224" y="406" font-size="15" fill="#2A2F45" font-weight="700" text-anchor="middle" >修正</text><rect x="264" y="382" width="64" height="36" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="296" y="406" font-size="15" fill="#2A2F45" font-weight="700" text-anchor="middle" >削除</text><text x="32" y="461" font-size="15" fill="#2A2F45" font-weight="400" text-anchor="start" >9/4 夕食 1,200円</text><rect x="192" y="440" width="64" height="36" rx="10" fill="#4DA8FF" stroke="#5A6178" stroke-width="2" fill-opacity="0.10" stroke-opacity="0.5"/><text x="224" y="464" font-size="15" fill="#2A2F45" font-weight="700" text-anchor="middle" >修正</text><rect x="264" y="440" width="64" height="36" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="296" y="464" font-size="15" fill="#2A2F45" font-weight="700" text-anchor="middle" >削除</text><text x="32" y="519" font-size="15" fill="#2A2F45" font-weight="400" text-anchor="start" >9/3 飲み物 180円</text><rect x="192" y="498" width="64" height="36" rx="10" fill="#4DA8FF" stroke="#5A6178" stroke-width="2" fill-opacity="0.10" stroke-opacity="0.5"/><text x="224" y="522" font-size="15" fill="#2A2F45" font-weight="700" text-anchor="middle" >修正</text><rect x="264" y="498" width="64" height="36" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="296" y="522" font-size="15" fill="#2A2F45" font-weight="700" text-anchor="middle" >削除</text><rect x="106" y="590" width="148" height="40" rx="14" fill="#FF8C42" stroke="#FF8C42" stroke-width="0" fill-opacity="0.12"/><text x="180" y="616" font-size="16" fill="#2A2F45" font-weight="700" text-anchor="middle" >修正を押す</text><path d="M180 640V672" fill="none" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" marker-end="url(#orange-arrow)"/><text x="180" y="704" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="middle" >画面2 修正画面</text><rect x="16" y="720" width="328" height="340" rx="18" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><text x="32" y="753" font-size="20" fill="#2A2F45" font-weight="700" text-anchor="start" >記録を修正</text><line x1="32" y1="768" x2="328" y2="768" stroke="#5A6178" stroke-opacity="0.5" stroke-width="2"/><text x="32" y="798" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="start" >金額</text><rect x="32" y="804" width="296" height="30" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="32" y="853" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="start" >日付</text><rect x="32" y="859" width="296" height="30" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="32" y="908" font-size="16" fill="#2A2F45" font-weight="400" text-anchor="start" >メモ</text><rect x="32" y="914" width="296" height="30" rx="10" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><rect x="32" y="958" width="90" height="40" rx="12" fill="#FF8C42" stroke="#5A6178" stroke-width="2" fill-opacity="0.12" stroke-opacity="0.5"/><text x="77" y="984" font-size="16" fill="#2A2F45" font-weight="700" text-anchor="middle" >保存</text><rect x="132" y="958" width="196" height="40" rx="12" fill="#FFFFFF" stroke="#5A6178" stroke-width="2" stroke-opacity="0.5"/><text x="230" y="984" font-size="16" fill="#2A2F45" font-weight="700" text-anchor="middle" >キャンセル</text><path d="M180 1070V1102" fill="none" stroke="#4DA8FF" stroke-width="4" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="36" y="1110" width="288" height="74" rx="16" fill="#4DA8FF" stroke="#4DA8FF" stroke-width="0" fill-opacity="0.12"/><text font-size="15" fill="#5A6178" font-weight="700" text-anchor="middle"><tspan x="180" y="1140">保存／キャンセル</tspan><tspan x="180" y="1162">画面1へ戻る</tspan></text><rect x="16" y="1194" width="328" height="84" rx="16" fill="#FFFFFF" stroke="#FFE2C7" stroke-width="2" /><circle cx="34" cy="1218" r="7" fill="#6FD49D"/><text font-size="15" fill="#2A2F45" font-weight="700" text-anchor="start"><tspan x="50" y="1224">保存と削除は画面1の中で</tspan><tspan x="50" y="1246">完結し、画面は移動しない</tspan></text><text font-size="15" fill="#5A6178" font-weight="400" text-anchor="start"><tspan x="16" y="1308">ワイヤーフレーム＝色や</tspan><tspan x="16" y="1328">装飾を付けずに、</tspan><tspan x="16" y="1348">どこに何を置くかだけを</tspan><tspan x="16" y="1368">描いた骨組み</tspan></text></g></svg>